name: "Converters — build and attach to the release"

# Tier 0 packaging outputs are release assets. On every v* tag: build the wasm
# bundles with an OPA that has the wasm engine, run the round-trip test for real,
# and upload the tarballs plus manifest to the GitHub release for that tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wasm:
    name: "WASM bundles"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: "Install OPA (non-static: includes the wasm engine)"
        env:
          OPA_VERSION: "v1.10.0"
        run: |
          curl -sL -o opa "https://github.com/open-policy-agent/opa/releases/download/${OPA_VERSION}/opa_linux_amd64"
          chmod +x opa && sudo mv opa /usr/local/bin/opa && opa version
      - name: "Build"
        run: |
          python3 -m pip install -q jsonschema
          make wasm
          make oscal
          bash converters/exports/oscal/test/roundtrip.sh | tee /tmp/oscal.log
          ! grep -q "^SKIP" /tmp/oscal.log
          (cd converters/exports/oscal && tar -czf "$GITHUB_WORKSPACE/oscal-catalogs.tar.gz" dist/catalogs out/all.json)
      - name: "Round-trip test (must not skip here)"
        run: |
          out="$(bash converters/packaging/wasm/test/roundtrip.sh)"; echo "$out"
          echo "$out" | grep -q '^SKIP' && { echo "::error::wasm engine missing in CI"; exit 1; }
          echo "$out" | grep -q '^FAIL' && exit 1 || true
      - name: "Attach to the release"
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd converters/packaging/wasm/out
          for f in *.tar.gz; do mv "$f" "wasm-${f}"; done
          mv manifest.json wasm-manifest.json
          gh release upload "${GITHUB_REF_NAME}" wasm-*.tar.gz wasm-manifest.json --clobber --repo "${GITHUB_REPOSITORY}"
          cd "$GITHUB_WORKSPACE"
          python3 converters/packaging/gatekeeper/build.py >/dev/null && (cd converters/packaging/gatekeeper/out && tar -czf ../../../../gatekeeper-templates.tar.gz templates constraints)
          python3 converters/packaging/kubewarden/build.py >/dev/null && (cd converters/packaging/kubewarden/out && tar -czf ../../../../kubewarden-policies.tar.gz .)
          python3 converters/packaging/terraform_platforms/build.py >/dev/null && (cd converters/packaging/terraform_platforms/out && tar -czf ../../../../terraform-cloud-policy-set.tar.gz policy-set)
          gh release upload "${GITHUB_REF_NAME}" gatekeeper-templates.tar.gz kubewarden-policies.tar.gz terraform-cloud-policy-set.tar.gz oscal-catalogs.tar.gz --clobber --repo "${GITHUB_REPOSITORY}"
