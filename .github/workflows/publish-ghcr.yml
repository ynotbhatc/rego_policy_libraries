name: Publish OPA bundle to GHCR

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # required for ghcr.io push

jobs:
  publish:
    name: Build and push OPA bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install OPA ${{ env.OPA_VERSION }}
        env:
          OPA_VERSION: "1.10.0"
        run: |
          curl -sL -o opa \
            "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          opa version

      - name: Install oras ${{ env.ORAS_VERSION }}
        env:
          ORAS_VERSION: "1.2.2"
        run: |
          curl -sL "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /tmp/ oras
          sudo mv /tmp/oras /usr/local/bin/oras
          oras version

      - name: Determine image tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="latest"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Image: ghcr.io/${{ github.repository_owner }}/rego_policy_libraries:$TAG"

      - name: Generate bundle manifest (explicit roots)
        run: |
          # Explicit roots let a consumer load this bundle alongside their
          # own site config (data.aac.aap.config) without an overlapping-root
          # rejection. Roots are computed from package names so the list never
          # goes stale. See scripts/gen_bundle_manifest.py and #841.
          REVISION=$(git describe --tags --always --dirty 2>/dev/null || echo "$GITHUB_SHA")
          python3 scripts/gen_bundle_manifest.py "$REVISION"
          echo "--- .manifest ---"; cat .manifest

      - name: Build OPA bundle
        run: |
          # Bundle mode (-b .) so the committed/generated .manifest roots are
          # honored. Ignores keep the published bundle to runtime policy only:
          # test modules (never shipped), sample/fixture JSON (not referenced
          # by any policy), and non-policy trees. Test files are excluded here
          # AND from the manifest roots — they must agree, and a mismatch fails
          # this build loudly before anything is published.
          opa build -b . --output bundle.tar.gz \
            --ignore '*_test.rego' \
            --ignore 'test_*.rego' \
            --ignore 'tests' \
            --ignore '_framework_key_tests' \
            --ignore '*.json' \
            --ignore 'docs' \
            --ignore 'scripts' \
            --ignore 'tools' \
            --ignore 'standard' \
            --ignore 'crosswalk' \
            --ignore '.github' \
            --ignore '.git' \
            --ignore '.claude'
          echo "Bundle size: $(du -sh bundle.tar.gz)"
          echo "Rego files: $(tar -tzf bundle.tar.gz | grep -c '\.rego')"
          echo "Manifest roots: $(tar -xzf bundle.tar.gz -O /.manifest | python3 -c 'import sys,json;print(len(json.load(sys.stdin)["roots"]))')"

      - name: Login to GHCR
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Two credentials, tried in order, each one actually verified:
          #   1. GHCR_PAT  — a personal access token with write:packages. The
          #      package predates this workflow (created by a manual push), so
          #      GITHUB_TOKEN could not write to it; the PAT was the workaround.
          #      PATs expire: the one set 2026-09-01 stopped working 2026-10-13
          #      and every run after that failed here with "denied".
          #   2. GITHUB_TOKEN — works once the package grants this repository
          #      Actions access (package settings -> Manage Actions access ->
          #      add ynotbhatc/rego_policy_libraries, role Write). No expiry.
          # The old `secrets.GHCR_PAT || secrets.GITHUB_TOKEN` only fell back
          # when the PAT was EMPTY, never when it was dead.
          try_login() {
            local label="$1" token="$2"
            [[ -n "$token" ]] || { echo "::notice::$label not set, skipping"; return 1; }
            if echo "$token" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin 2>/tmp/login.err; then
              echo "Logged in to ghcr.io with $label"
              return 0
            fi
            echo "::warning::$label rejected by ghcr.io: $(tr -d '\n' </tmp/login.err)"
            return 1
          }
          try_login GHCR_PAT "$GHCR_PAT" && exit 0
          try_login GITHUB_TOKEN "$GH_TOKEN" && exit 0
          echo "::error::Cannot authenticate to ghcr.io. Fix one of: (a) rotate the GHCR_PAT secret with a token that has write:packages; (b) grant this repository Actions write access on the package https://github.com/users/${{ github.repository_owner }}/packages/container/rego_policy_libraries/settings and delete the GHCR_PAT secret."
          exit 1

      - name: Push OPA bundle to GHCR
        run: |
          oras push \
            "ghcr.io/${{ github.repository_owner }}/rego_policy_libraries:${{ steps.tag.outputs.tag }}" \
            --artifact-type "application/vnd.opa.bundle" \
            bundle.tar.gz:application/vnd.opa.bundle.layer.v1.tar+gzip \
            --annotation "org.opencontainers.image.title=Rego Policy Libraries" \
            --annotation "org.opencontainers.image.description=$(tar -tzf bundle.tar.gz | grep -c '\.rego$') OPA policy files: CIS Benchmarks, DISA STIGs, NERC-CIP, IEC 62443, ISO 27001, SOC 2, NIST, and 50+ frameworks" \
            --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation "org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}" \
            --annotation "org.opencontainers.image.version=${{ steps.tag.outputs.tag }}" \
            --annotation "org.opencontainers.image.licenses=Apache-2.0" \
            --annotation "org.opencontainers.image.revision=${{ github.sha }}"

      - name: Summary
        run: |
          echo "## OPA Bundle Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tag:** \`${{ steps.tag.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Digest:** $(oras manifest fetch ghcr.io/${{ github.repository_owner }}/rego_policy_libraries:${{ steps.tag.outputs.tag }} | python3 -c 'import json,sys; print(json.load(sys.stdin).get(\"config\",{}).get(\"digest\",\"see GHCR\"))')" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Pull this bundle" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "oras pull ghcr.io/${{ github.repository_owner }}/rego_policy_libraries:${{ steps.tag.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
