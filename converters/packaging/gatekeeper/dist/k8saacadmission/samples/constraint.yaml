apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sAacAdmission
metadata:
  name: k8saacadmission-default
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: ["", "apps", "batch"]
        kinds: ["Pod", "Deployment", "StatefulSet", "DaemonSet", "Job", "CronJob", "Service", "Namespace"]
