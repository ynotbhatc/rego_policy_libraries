apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sPssProfile
metadata:
  name: k8spssprofile-default
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
      - apiGroups: ["apps"]
        kinds: ["Deployment", "StatefulSet", "DaemonSet", "ReplicaSet"]
      - apiGroups: ["batch"]
        kinds: ["Job", "CronJob"]
  parameters:
    profile: restricted
