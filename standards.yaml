      - {standard: UK MoD DEF STAN 05-138, version: Issue 4, publisher: UK MoD DStan / IASME, literal: "DEF STAN 05-138 Issue 4", check: {method: manual, url: "https://www.gov.uk/government/publications/defence-cyber-certification"}}
  uk_dpa_2018:
    standards:
      - {standard: UK Data Protection Act 2018, version: "2026-09-30", publisher: UK Parliament, literal: "revised to 2026-09-30", check: {method: manual, url: "https://www.legislation.gov.uk/ukpga/2018/12/contents"}}
  bsi_c5:
    standards:
      - {standard: BSI C5 Cloud Computing Compliance Criteria Catalogue, version: "2026", publisher: BSI, literal: "BSI C5:2026", check: {method: page_regex, url: "https://www.bsi.bund.de/EN/Themen/Unternehmen-und-Organisationen/Informationen-und-Empfehlungen/Empfehlungen-nach-Angriffszielen/Cloud-Computing/Kriterienkatalog-C5/kriterienkatalog-c5_node.html", pattern: 'C5:?(20\d\d)'}}
  essential_eight:
    standards:
      - {standard: ACSC Essential Eight Maturity Model, version: Nov 2023, publisher: ASD ACSC, literal: "Essential Eight Maturity Model (Nov 2023)", check: {method: manual, url: "https://www.cyber.gov.au/resources-business-and-government/essential-cyber-security/essential-eight/essential-eight-maturity-model"}}
  cert_in:
    standards:
      - {standard: CERT-In Directions under s.70B(6) IT Act, version: 28 April 2022, publisher: CERT-In / MeitY, literal: "(28 April 2022)", check: {method: manual, url: "https://www.cert-in.org.in/Directions70B.jsp"}}
  dpdp_india:
    standards:
      - {standard: India DPDP Act 2023 and DPDP Rules 2025, version: Rules 2025, publisher: MeitY, literal: "DPDP Rules 2025", check: {method: manual, url: "https://www.meity.gov.in/data-protection-framework"}}
  meti_csm:
    standards:
      - {standard: METI Cybersecurity Management Guidelines, version: Ver. 3.0, publisher: METI / IPA, literal: "METI Cybersecurity Management Guidelines Ver. 3.0", check: {method: manual, url: "https://www.meti.go.jp/policy/netsecurity/mng_guide.html"}}
  ccpa:
    standards:
      - {standard: CCPA regulations (11 CCR) incl. 2025 CPPA package (ADMT, audits, risk assessments), version: current, publisher: California CPPA, literal: "11 CCR Article 11", check: {method: manual, url: "https://cppa.ca.gov/regulations/"}}
  digital_sovereignty:
    internal: true
    note: AAC aggregator over sovereignty controls; no single upstream standard

  # ---------------------------------------------------------------- AI, application security, platforms
  owasp_llm:
    standards:
      - {standard: OWASP Top 10 for LLM Applications, version: "2026", publisher: OWASP GenAI Security Project, literal: "OWASP Top 10 for LLM Applications — 2026 edition", check: {method: manual, url: "https://genai.owasp.org/llm-top-10/"}}
      - {standard: MITRE ATLAS (mitigation crosswalk metadata), version: v2026.09, publisher: MITRE, literal: "atlas-data v2026.09", check: {method: github_release, repo: mitre-atlas/atlas-data}}
  owasp_top10:
    standards:
      - {standard: OWASP Top 10, version: "2025", publisher: OWASP, literal: "OWASP Top 10:2025", check: {method: manual, url: "https://owasp.org/Top10/"}}
  pss_kubernetes:
    standards:
      - {standard: Kubernetes Pod Security Standards, version: current, publisher: Kubernetes SIG Auth, literal: "Kubernetes Pod Security Standards", check: {method: manual, url: "https://kubernetes.io/docs/concepts/security/pod-security-standards/", note: "versionless page; field lists current as of 2026-09 per the module"}}
  scuba_m365:
    standards:
      - {standard: CISA SCuBA Microsoft 365 baselines (ScubaGear), version: unknown, publisher: CISA, check: {method: github_release, repo: cisagov/ScubaGear, note: "policy ids are versioned one by one; the module pins no ScubaGear release, so any release is reported for review"}}
  sap_abap_baseline:
    standards:
      - {standard: SAP Security Baseline Template (ABAP), version: v2.6, publisher: SAP, literal: "SAP Security Baseline Template v2.6", check: {method: manual, url: "https://support.sap.com/en/offerings-programs/support-services/security-optimization-services-portfolio/security-baseline-template.html"}}
      - {standard: SAP-samples frun-csa-policies-best-practices (imported commit), version: 888f3c53, publisher: SAP, literal: "888f3c53", check: {method: github_commit, repo: SAP-samples/frun-csa-policies-best-practices}}
  geisa:
    standards:
      - {standard: GEISA application manifest specification, version: unknown, publisher: GEISA, check: {method: none, note: "no public machine-readable release feed known"}}

  # ---------------------------------------------------------------- supply chain
  supply_chain_slsa:
    standards:
      - {standard: SLSA build track, version: v1.0, publisher: OpenSSF, literal: "SLSA v1.0", check: {method: page_regex, url: "https://slsa.dev/spec/", pattern: 'SLSA (?:specification )?v(\d+\.\d+)'}}
  supply_chain_s2c2f:
    standards:
      - {standard: OpenSSF S2C2F, version: unknown, publisher: OpenSSF, check: {method: github_release, repo: ossf/s2c2f}}
  supply_chain_scrm_800_161:
    standards:
      - {standard: NIST SP 800-161, version: r1, publisher: NIST, literal: "800-161r1", check: {method: manual, url: "https://csrc.nist.gov/pubs/sp/800/161/r1/upd1/final"}}
  supply_chain_ssdf:
    standards:
      - {standard: NIST SP 800-218 SSDF (substrate mapping), version: unknown, publisher: NIST, check: {method: manual, url: "https://csrc.nist.gov/pubs/sp/800/218/final", note: "the full SSDF module is nist_ssdf (v1.1)"}}
  supply_chain_ssdf_genai:
    standards:
      - {standard: NIST SP 800-218A, version: unknown, publisher: NIST, check: {method: manual, url: "https://csrc.nist.gov/pubs/sp/800/218/a/final"}}
  supply_chain_baseline: {internal: true, note: AAC supply-chain spine}
