# standards.yaml — machine-readable registry of the upstream standard every framework key implements.
#
# One entry per `custom.framework` key found in the policy trees (opa inspect). For each key:
#   standards: list of what the key implements
#     standard   name of the upstream document
#     version    the exact version the module implements, read from the module text. "unknown" when the module
#                never states it (listed by --offline as a warning for a human to settle); "current" for living
#                regulation text tracked by amendment date
#     publisher  upstream owner
#     literal    text that must appear in a non-test .rego file of the key's directories; `version` must be a
#                substring of it (a leading "v" ignored). Keeps this file and the modules from drifting apart.
#     check      how scripts/check_standard_releases.py looks for a newer release (methods documented there)
#   internal: true  for AAC-authored policy with no upstream standard (no check)
#
# Validate offline:  python3 scripts/check_standard_releases.py --offline   (run by `make check-standards`)
# Network check:     python3 scripts/check_standard_releases.py [--json out.json]
# Human registry with cadence and notes: STANDARDS_UPDATE_REGISTRY.md. Update both in the PR that changes a module.
schema: 1
updated: "2026-11-21"

# Checks shared by a whole family; run once per invocation.
families:
  cis:
    method: cis_monthly
    url: https://www.cisecurity.org/insights/blog
    checked_against: "November 2026"
    note: CIS publishes no machine-readable feed; the monthly "CIS Benchmarks <Month> <Year> Update" post is the signal. A newer post means every cis row needs a look.
  disa:
    method: disa_compilation
    checked_against: "October 2026"
    note: quarterly U_SRG-STIG_Library_<Month>_<Year>.zip on dl.dod.cyber.mil

